[package]
name = "explaindb"
version = "0.1.0"
description = "The store core of ExplainDB in Rust: predicates, a versioned key-value store and an MVCC store."
edition = "2024"
# Keep equal to the channel in rust-toolchain.toml and the image tag of the rust_test job in .gitlab-ci.yml.
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
indexmap = "2.14"
# Held at 0.11.0 until 0.11.1 (published 2026-10-12) is two weeks old
# (see docs/changes/014-rust-brute-force-validation).
sha2 = "=0.11.0"

# Every item, private ones included, needs a doc comment, with the sections "# Errors" and "# Panics" where they
# apply (see CONTRIBUTING.md). No unsafe code.
[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
