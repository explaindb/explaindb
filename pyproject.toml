[project]
name = "dbsys-materials"
version = "0.1.0"
description = "Database Systems teaching materials: notebooks and a didactic Python DBMS."
requires-python = ">=3.12,<3.13"
dependencies = [
    "black[jupyter]==26.10.1",
    "faker==30.8.2",
    "ipycanvas==0.13.3",
    "ipywidgets==8.1.5",
    "jupyter==1.1.1",
    "matplotlib==3.9.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "seaborn==0.13.2",
    "tqdm==4.67.0",
    "pylint==4.0.9",
    "nbqa==1.9.0",
    "coverage==7.6.4",
    "deprecation==2.1.0",
    "duckdb==1.1.3",
    "graphviz==0.20.3",
    "pydantic==2.10.4",
    "sphinx==8.2.3",
    "furo==2025.12.19",
    "ipython==9.17.0",
    "pyyaml==6.0.3",
]

# Packages that only some CI jobs (and the same commands run locally) need. The
# groups are not default groups, so `uv sync` does not install them, and the
# export for Binder (.binder/requirements.txt) leaves them out; the dependency
# audit covers them (see .gitlab-ci.yml).
[dependency-groups]
# The browser test of the pages in visualizations/
# (system/tests/repo/test_visualizations.py) and tools/render_video.py with its
# tests (CI jobs `visualization_test` and `render_video_test`). The type check
# (CI job `type_check`) installs it, too, so that pyright can resolve the
# imports of Playwright in system/tests/repo/.
browser-tests = [
    "playwright==1.64.1",
]
# The type check of system/ with pyright (CI job `type_check`, configured in
# [tool.pyright] below; see CONTRIBUTING.md, section Type check). The extra
# `nodejs` brings Node.js, which pyright runs on, as the locked package
# nodejs-wheel-binaries; raise it together with pyright.
type-check = [
    "pyright[nodejs]==1.1.414",
]

[tool.uv]
# This repository is a collection of notebooks plus the `system/` package used
# via the current working directory; it is not itself an installable package.
package = false

# Configuration for nbqa (https://github.com/nbQA-dev/nbQA), used by the CI
# `stats_and_linting` job to run pylint over the notebooks. The .py sources use
# .pylintrc; here we additionally silence checks that fire on patterns inherent
# to notebooks rather than on real defects:
#   - imports are introduced per cell, where first needed (wrong-import-*,
#     ungrouped-imports, multiple-imports, reimported);
#   - cells share one global namespace (redefined-outer-name);
#   - notebooks document themselves via markdown, not docstrings
#     (missing-*-docstring);
#   - a trailing expression in a cell is how Jupyter displays a value
#     (pointless-statement);
#   - short exploratory/teaching names and teaching wildcard imports
#     (invalid-name, wildcard-import, unused-wildcard-import);
#   - teaching notebooks legitimately repeat boilerplate setup (duplicate-code).
[tool.nbqa.addopts]
pylint = [
    "--disable=wrong-import-position,wrong-import-order,ungrouped-imports,multiple-imports,reimported,redefined-outer-name,missing-module-docstring,missing-class-docstring,missing-function-docstring,pointless-statement,invalid-name,wildcard-import,unused-wildcard-import,duplicate-code",
]

# Configuration of pyright (https://microsoft.github.io/pyright), the static type
# checker that the CI job `type_check` runs over system/; any error fails the
# job (see CONTRIBUTING.md, section Type check, and docs/changes/053-pyright-ci).
# system/tests/repo/test_type_check.py checks that these settings still make
# pyright check system/ and that there are no others, as other settings could
# take files out of the check or hide errors.
[tool.pyright]
include = ["system"]
# pyright's default mode, in which system/ was brought to 0 errors; stated so
# that a new pyright version cannot change it unnoticed:
typeCheckingMode = "standard"
# the platform of the CI runners, so that a run on macOS gives the job's result:
pythonPlatform = "Linux"
