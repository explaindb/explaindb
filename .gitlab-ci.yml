workflow:
  rules:
    # Don't run simple push pipelines
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      when: never
    # Allow to interrupt pipelines on merge request if a new commit arrives
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      auto_cancel:
        on_new_commit: interruptible
    # Do not interrupt pipelines on main
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none

stages:
  - prepare
  - test
  - deploy

# Shared build steps for the API documentation. Both the merge-request check
# (docs_build) and the publish job (pages) run exactly the same build, so the
# check validates precisely what would be published. sphinx-apidoc regenerates
# the per-module stubs (--implicit-namespaces is required: `system` is a PEP 420
# namespace package with no __init__.py); sphinx-build -W turns any warning --
# an import failure, a dangling :meth: cross-reference, an unconverted Javadoc
# tag -- into a hard error. Output goes to public/ as GitLab Pages expects.
.build_docs:
  script:
    # --frozen installs exactly what uv.lock pins and never re-resolves or
    # rewrites it. It does not check uv.lock against pyproject.toml, so a stale
    # lockfile is not caught here (that would need --locked); the
    # binder_requirements job catches it instead.
    - uv sync --frozen
    - uv run sphinx-apidoc --implicit-namespaces --no-toc --force --separate -o docs/api system system/tests
    - uv run sphinx-build -W -b html docs/api public

# Detect merge requests that only touch Markdown files. If every file changed
# against the target branch ends in `.md`, export DOCS_ONLY=true as a dotenv
# artifact. The test jobs below inherit that variable (a job without its own
# `needs` receives the dotenv reports of earlier-stage jobs) and exit early when
# it is true, so a docs-only merge request runs none of the tests. The check is
# conservative: it only skips when *every* changed file is Markdown, and it never
# skips on the default branch -- anything else leaves DOCS_ONLY=false. The
# top-level README.md does not count as docs-only: a unit test
# (system/tests/test_readme_notebooks.py) checks its notebook table.
detect-docs-only:
  stage: prepare
  tags:
    - test
  # Full history so the diff against the target branch can be computed.
  variables:
    GIT_DEPTH: 0
  script:
    - |
      DOCS_ONLY=false
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        BASE="$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)"
        CHANGED="$(git diff --name-only "$BASE" HEAD)"
        echo "Changed files vs $BASE:"
        printf '%s\n' "$CHANGED"
        # docs-only: at least one change, no changed file is a non-.md file, and
        # README.md is not among them (its notebook table is tested)
        if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE '\.md$' \
            && ! printf '%s\n' "$CHANGED" | grep -qx 'README.md'; then
          DOCS_ONLY=true
        fi
      fi
      echo "DOCS_ONLY=$DOCS_ONLY"
      echo "DOCS_ONLY=$DOCS_ONLY" > docs_only.env
  artifacts:
    reports:
      dotenv: docs_only.env
  interruptible: true

formatting:
  stage: test
  tags:
    - test
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Install dependencies (incl. black) from the locked environment
    - uv sync --frozen
    # Use black to verify the correct formatting of all files
    - uv run black --check .
  interruptible: true

# mybinder.org cannot read uv.lock, so .binder/requirements.txt is an export of
# it. Regenerate the export in place and fail if it differs from the committed
# file (or is missing), i.e. if a dependency change was committed without
# re-exporting. The export omits header and annotations so only the pins are
# compared, not text that varies between uv versions. Unlike the command in
# CONTRIBUTING.md, the job uses --locked instead of --frozen: it additionally
# fails when uv.lock itself is out of date with pyproject.toml (pyproject.toml
# edited without running `uv lock`). Otherwise keep the export flags identical
# to the command in CONTRIBUTING.md and in the dependency_audit job below.
binder_requirements:
  stage: test
  tags:
    - test
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Log the uv version: export output and flags can differ between versions.
    - uv --version
    - |
      if ! uv export --locked --no-dev --no-hashes --no-header --no-annotate --format requirements.txt -o .binder/requirements.txt; then
        echo "uv export failed (most likely uv.lock is out of date with pyproject.toml; see the error above)."
        echo "Run 'uv lock', then regenerate .binder/requirements.txt (see CONTRIBUTING.md, section Dependencies)."
        exit 1
      fi
    # git diff prints the changed pins into the job log. If the file was deleted
    # from the repository, the export above recreates it as an untracked file,
    # which git diff ignores; git status catches that case. Keep both checks.
    - |
      if ! git diff --exit-code -- .binder/requirements.txt || [ -n "$(git status --porcelain -- .binder/requirements.txt)" ]; then
        echo ".binder/requirements.txt is missing or out of date with uv.lock. Regenerate it with:"
        echo "  uv export --frozen --no-dev --no-hashes --no-header --no-annotate --format requirements.txt -o .binder/requirements.txt"
        echo "(see CONTRIBUTING.md, section Dependencies)."
        exit 1
      fi
  interruptible: true

# Fail the pipeline if any locked dependency has a known vulnerability. Keep
# this a hard failure (no allow_failure): findings must block merging, see
# docs/changes/002-dependency-audit. pip-audit is run via `uv tool run` rather
# than added as a dependency, so it stays out of uv.lock and the Binder image.
# To accept an advisory that has no fixed version yet (or a false positive),
# append `--ignore-vuln <ID>` to the pip-audit command and put a YAML comment
# above it giving the reason and the date; remove it once a fixed version
# exists. How to fix a finding: CONTRIBUTING.md, section Dependencies >
# Security audit.
dependency_audit:
  stage: test
  tags:
    - test
  # A network hiccup (downloading pip-audit, querying the vulnerability
  # service) fails the script just like a finding; one retry absorbs it. A real
  # finding simply fails twice.
  retry:
    max: 1
    when:
      - script_failure
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Log the uv version: export output and flags can differ between versions.
    - uv --version
    # Same export flags as binder_requirements and CONTRIBUTING.md. --frozen
    # audits exactly what uv.lock pins (a uv.lock out of date with
    # pyproject.toml is caught by binder_requirements). --no-dev has no effect
    # today because the project has no dependency groups; revisit if one is
    # added.
    - uv export --frozen --no-dev --no-hashes --no-header --no-annotate --format requirements.txt -o /tmp/audit-requirements.txt
    # pip-audit is pinned so a new release cannot change the result without
    # notice, and --exclude-newer pins its own dependencies to what was
    # published by that date; bump both deliberately (at least once per
    # semester, to pick up fixes in pip-audit's own dependencies). --no-deps and
    # --disable-pip: every line is already an exact pin, so nothing needs to be
    # resolved or installed. --strict also fails if a package cannot be
    # audited; --desc prints what each vulnerability is; --progress-spinner off
    # keeps the CI log readable.
    - uv tool run --exclude-newer 2026-10-01T00:00:00Z pip-audit==2.10.1 --strict --no-deps --disable-pip --progress-spinner off --desc -r /tmp/audit-requirements.txt
  interruptible: true

# Secret detection with Gitleaks in merge requests: scans only the commits of
# the merge request (from the merge base with the target branch to HEAD), so
# old commits never block a merge request, and fails if one of them adds a
# secret (password, API token, private key, ...). It also runs when only
# Markdown changed, as secrets can be in any file. Gitleaks' default rules
# apply; CONTRIBUTING.md explains how to accept a false positive (see also
# docs/changes/007-gitleaks-secret-detection).
gitleaks_secret_detection:
  # In the first stage: the job is quick, and if it finds a secret the test
  # stage does not run at all.
  stage: prepare
  tags:
    - test
  # The official image, pinned by tag and digest (a checksum of the exact
  # image) so that a new release or a moved tag cannot change the result
  # without notice; bump both together. The image starts the gitleaks command by
  # default; the empty entrypoint [""] makes GitLab run the script lines below
  # in a shell instead.
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    # Full history, so that the merge base with the target branch can be found.
    GIT_DEPTH: 0
    # Read git attributes from the empty tree (git's fixed ID for it) instead of
    # the merge request's .gitattributes: an entry such as `* -diff` would hide
    # file contents from `git log -p` and so from the scan. Files that git
    # itself detects as binary are still skipped. Needs git 2.42 or newer; an
    # older git ignores the variable without any warning.
    GIT_ATTR_SOURCE: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
  # The job fetches from GitLab; one retry absorbs a network hiccup. A found
  # secret simply fails twice.
  retry:
    max: 1
    when:
      - script_failure
  script:
    # Avoid git's "dubious ownership" error on a checkout owned by another user.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Log the git version: GIT_ATTR_SOURCE needs git 2.42 or newer (an older
    # git ignores it silently), --remerge-diff below needs 2.36 or newer.
    - git --version
    # Fetch the current target branch explicitly: the runner's checkout may lack
    # it or hold an old copy, and an old merge base would make the scan include
    # commits that are already on the target branch.
    - git fetch origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    # The commit the merge request branched off: only commits after it are scanned.
    - BASELINE="$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)"
    - echo "Scanning $(git rev-list --count "$BASELINE..HEAD") commit(s) after $BASELINE"
    # A fixed configuration with only the default rules: otherwise gitleaks
    # would read a .gitleaks.toml from the merge request itself, which could
    # switch rules off unnoticed. (.gitleaksignore and gitleaks:allow comments
    # still apply; reviewers check every new entry.)
    - printf '[extend]\nuseDefault = true\n' > /tmp/gitleaks.toml
    # Merges of three or more branches ("octopus" merges) cannot be scanned
    # (--remerge-diff below handles two parents only), so they fail the job.
    - test -z "$(git rev-list --min-parents=3 "$BASELINE..HEAD")" || { echo "Octopus merges cannot be scanned; split them into normal merges."; exit 1; }
    # --remerge-diff also scans what a merge commit changes compared with an
    # automatic merge of its parents, e.g. a secret added while resolving a
    # conflict; gitleaks reads commits with `git log -p`, which by default shows
    # nothing for merge commits. --redact keeps a found secret out of the job
    # log and the report (job logs are readable by every logged-in user); the
    # report keeps the fingerprints needed for .gitleaksignore. gitleaks exits 1
    # on a finding, which fails the job.
    - >
      gitleaks git .
      --log-opts="--remerge-diff $BASELINE..HEAD"
      --config /tmp/gitleaks.toml
      --redact
      --verbose
      --report-format json
      --report-path gitleaks-report.json
  artifacts:
    # Keep the report also when the job fails, so findings can be inspected.
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week
  rules:
    # Only in merge requests: the scan needs a target branch.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true

py_test:
  stage: test
  tags:
    - test
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Install the locked environment
    - uv sync --frozen
    # Show the resolved dependency versions
    - uv pip freeze
    # Run all unit tests with coverage
    - uv run coverage run -m unittest discover system/tests/
    # Print the summary so GitLab can read the total (see `coverage:` below).
    - uv run coverage report
    - uv run coverage html
  # GitLab reads the coverage value from the TOTAL line of `coverage report`
  # (shown in merge requests and in the project's coverage badge). Keep the
  # capture group: GitLab uses it as the value; without it, GitLab would take
  # the first number on the line (the statement count). Changing the report
  # layout (e.g. branch coverage or show_missing in .coveragerc, or a coverage
  # upgrade) can change the TOTAL line; the regex then silently stops matching
  # and GitLab records no value (no error), so adapt it together with such a
  # change.
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%$/'
  interruptible: true
  artifacts:
    paths:
      - htmlcov/*


ipynb_test:
  stage: test
  tags:
    - test
  # Run the notebooks in parallel across several jobs to cut wall-clock time.
  # Every notebook is still executed -- .ci/assign_notebooks.py splits the set
  # across the N instances, so coverage is unchanged, only faster.
  parallel: 3
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Install the locked environment
    - uv sync --frozen
    # Execute this instance's slice of the notebooks. GitLab sets CI_NODE_INDEX
    # (1..N) and CI_NODE_TOTAL (N); .ci/assign_notebooks.py reads those and packs
    # the notebooks onto the instances by measured run time (LPT bin-packing, see
    # .ci/notebook_weights.tsv) so the instances finish at roughly the same time.
    # We run from the notebooks/ directory so the working directory matches an
    # interactive Jupyter session (kernel cwd = the notebook's folder): notebooks
    # reach the `system` package via their sys.path bootstrap cell and read their
    # data files relative to notebooks/. `set -e` makes the job fail as soon as
    # any notebook raises.
    - |
      set -e
      cd notebooks
      python3 "$CI_PROJECT_DIR/.ci/assign_notebooks.py" > /tmp/nb_slice
      while IFS= read -r nb; do
        echo "== [node ${CI_NODE_INDEX:-1}/${CI_NODE_TOTAL:-1}] running $nb =="
        uv run jupyter nbconvert --to script "$nb" --stdout > /tmp/nb.py
        uv run ipython /tmp/nb.py
      done < /tmp/nb_slice
  interruptible: true


stats_and_linting:
  stage: test
  tags:
    - test
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # count lines of code for each py and ipynb file, plus the sum:
    - find . \( -iname \*.ipynb -o -iname \*.py \) -not -path "*venv*" -print0 | xargs -0 wc -l > LOC.txt
    # Install the locked environment, required for pylint and nbqa
    - uv sync --frozen
    # show pylint output of code for each py file:
    - find . -iname \*.py -not -path "*venv*" -print0 | xargs -0 uv run pylint --exit-zero > pylint_py.txt
    # show pylint output of code for each ipynb file:
    - find . -iname \*.ipynb -not -path "*venv*" -print0 | xargs -0 uv run nbqa pylint --exit-zero > pylint_ipynb.txt
  artifacts:
    paths:
      - LOC.txt
      - pylint_py.txt
      - pylint_ipynb.txt
  interruptible: true


# Build the API documentation on merge requests as a pre-merge check only (no
# preview is published). A broken import, dangling cross-reference, or
# unconverted Javadoc tag fails the pipeline here, before the change reaches the
# default branch where `pages` would publish it. Scoped to merge-request
# pipelines: on the default branch the `pages` job already runs the same build.
docs_build:
  stage: test
  tags:
    - test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only);
    # the API site is generated from the .py sources, so Markdown-only changes
    # cannot affect it.
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    - !reference [.build_docs, script]
  interruptible: true


# Publish the API documentation to GitLab Pages from the default branch only.
# Pages serves the `public/` artifact; access is restricted to project members
# (pages_access_level=private on this project).
pages:
  stage: deploy
  tags:
    - test
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  script:
    - !reference [.build_docs, script]
  artifacts:
    paths:
      - public
