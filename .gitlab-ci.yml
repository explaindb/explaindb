workflow:
  rules:
    # Don't run simple push pipelines
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      when: never
    # Allow to interrupt pipelines on merge request if a new commit arrives
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      auto_cancel:
        on_new_commit: interruptible
    # Do not interrupt pipelines on main
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none

stages:
  - prepare
  - test
  - deploy

# Scheduled pipelines (the nightly run on main) run only serializability_nightly,
# dependency_audit, rust_dependency_audit and generated_rust_check; every other
# job extends this template to stay out of them. A job that needs its own
# `rules` cannot use this template (its rules would replace the template's); it
# starts its rules with the `schedule ... when: never` rule instead, as
# `docs_build` and `pages` do. system/tests/repo/test_ci_config.py fails for a
# job that does neither. A new job meant for the nightly pipeline is added to
# SCHEDULED_JOBS in that test instead.
.not_in_scheduled_pipelines:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - when: on_success

# Shared build steps for the API documentation. Both the merge-request check
# (docs_build) and the publish job (pages) run exactly the same build, so the
# check validates precisely what would be published. sphinx-apidoc regenerates
# the per-module stubs (--implicit-namespaces is required: `system` is a PEP 420
# namespace package with no __init__.py); sphinx-build -W turns any warning --
# an import failure, a dangling :meth: cross-reference, an unconverted Javadoc
# tag -- into a hard error. Output goes to public/ as GitLab Pages expects.
.build_docs:
  script:
    # --frozen installs exactly what uv.lock pins and never re-resolves or
    # rewrites it. It does not check uv.lock against pyproject.toml, so a stale
    # lockfile is not caught here (that would need --locked); the
    # binder_requirements job catches it instead.
    - uv sync --frozen
    - uv run sphinx-apidoc --implicit-namespaces --no-toc --force --separate -o docs/api system system/tests
    - uv run sphinx-build -W -b html docs/api public

# Detect merge requests that only touch Markdown files. If every file changed
# against the target branch ends in `.md`, export DOCS_ONLY=true as a dotenv
# artifact. The test jobs below inherit that variable (a job without its own
# `needs` receives the dotenv reports of earlier-stage jobs) and exit early when
# it is true, so a docs-only merge request runs none of the tests. The check is
# conservative: it only skips when *every* changed file is Markdown, and it never
# skips on the default branch -- anything else leaves DOCS_ONLY=false. The
# top-level README.md does not count as docs-only: a unit test
# (system/tests/repo/test_readme_notebooks.py) checks its notebook table. Neither
# does generated/rust/README.md: rust_test runs its code example as a test.
detect-docs-only:
  stage: prepare
  extends: .not_in_scheduled_pipelines
  tags:
    - test
  # Full history so the diff against the target branch can be computed.
  variables:
    GIT_DEPTH: 0
  script:
    - |
      DOCS_ONLY=false
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        BASE="$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)"
        CHANGED="$(git diff --name-only "$BASE" HEAD)"
        echo "Changed files vs $BASE:"
        printf '%s\n' "$CHANGED"
        # docs-only: at least one change, no changed file is a non-.md file, and
        # neither README.md (its notebook table is tested) nor
        # generated/rust/README.md (its code example is tested) is among them
        if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE '\.md$' \
            && ! printf '%s\n' "$CHANGED" | grep -qxE 'README\.md|generated/rust/README\.md'; then
          DOCS_ONLY=true
        fi
      fi
      echo "DOCS_ONLY=$DOCS_ONLY"
      echo "DOCS_ONLY=$DOCS_ONLY" > docs_only.env
  artifacts:
    reports:
      dotenv: docs_only.env
  interruptible: true

formatting:
  stage: test
  extends: .not_in_scheduled_pipelines
  tags:
    - test
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Install dependencies (incl. black) from the locked environment
    - uv sync --frozen
    # Use black to verify the correct formatting of all files
    - uv run black --check .
  interruptible: true

# mybinder.org cannot read uv.lock, so .binder/requirements.txt is an export of
# it. Regenerate the export in place and fail if it differs from the committed
# file (or is missing), i.e. if a dependency change was committed without
# re-exporting. The export omits header and annotations so only the pins are
# compared, not text that varies between uv versions. Unlike the command in
# CONTRIBUTING.md, the job uses --locked instead of --frozen: it additionally
# fails when uv.lock itself is out of date with pyproject.toml (pyproject.toml
# edited without running `uv lock`). Otherwise keep the export flags identical
# to the command in CONTRIBUTING.md and in the dependency_audit job below.
binder_requirements:
  stage: test
  extends: .not_in_scheduled_pipelines
  tags:
    - test
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Log the uv version: export output and flags can differ between versions.
    - uv --version
    - |
      if ! uv export --locked --no-dev --no-hashes --no-header --no-annotate --format requirements.txt -o .binder/requirements.txt; then
        echo "uv export failed (most likely uv.lock is out of date with pyproject.toml; see the error above)."
        echo "Run 'uv lock', then regenerate .binder/requirements.txt (see CONTRIBUTING.md, section Dependencies)."
        exit 1
      fi
    # git diff prints the changed pins into the job log. If the file was deleted
    # from the repository, the export above recreates it as an untracked file,
    # which git diff ignores; git status catches that case. Keep both checks.
    - |
      if ! git diff --exit-code -- .binder/requirements.txt || [ -n "$(git status --porcelain -- .binder/requirements.txt)" ]; then
        echo ".binder/requirements.txt is missing or out of date with uv.lock. Regenerate it with:"
        echo "  uv export --frozen --no-dev --no-hashes --no-header --no-annotate --format requirements.txt -o .binder/requirements.txt"
        echo "(see CONTRIBUTING.md, section Dependencies)."
        exit 1
      fi
  interruptible: true

# Fail the pipeline if any locked dependency has a known vulnerability. Keep
# this a hard failure (no allow_failure): findings must block merging, see
# docs/changes/002-dependency-audit. pip-audit is run via `uv tool run` rather
# than added as a dependency, so it stays out of uv.lock and the Binder image.
# To accept an advisory that has no fixed version yet (or a false positive),
# append `--ignore-vuln <ID>` to the pip-audit command and put a YAML comment
# above it giving the reason and the date; remove it once a fixed version
# exists. How to fix a finding: CONTRIBUTING.md, section Dependencies >
# Security audit. Runs in the nightly scheduled pipeline as well, so new
# advisories are reported without a commit.
dependency_audit:
  stage: test
  tags:
    - test
  # A network hiccup (downloading pip-audit, querying the vulnerability
  # service) fails the script just like a finding; one retry absorbs it. A real
  # finding simply fails twice.
  retry:
    max: 1
    when:
      - script_failure
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Log the uv version: export output and flags can differ between versions.
    - uv --version
    # Same export flags as binder_requirements and CONTRIBUTING.md. --frozen
    # audits exactly what uv.lock pins (a uv.lock out of date with
    # pyproject.toml is caught by binder_requirements). --no-dev has no effect
    # today because the project has no dependency groups; revisit if one is
    # added.
    - uv export --frozen --no-dev --no-hashes --no-header --no-annotate --format requirements.txt -o /tmp/audit-requirements.txt
    # pip-audit is pinned so a new release cannot change the result without
    # notice, and --exclude-newer pins its own dependencies to what was
    # published by that date; bump both deliberately (at least once per
    # semester, to pick up fixes in pip-audit's own dependencies). --no-deps and
    # --disable-pip: every line is already an exact pin, so nothing needs to be
    # resolved or installed. --strict also fails if a package cannot be
    # audited; --desc prints what each vulnerability is; --progress-spinner off
    # keeps the CI log readable.
    - uv tool run --exclude-newer 2026-10-01T00:00:00Z pip-audit==2.10.1 --strict --no-deps --disable-pip --progress-spinner off --desc -r /tmp/audit-requirements.txt
  interruptible: true

# The Rust counterpart of dependency_audit: fails the pipeline if a crate pinned
# in generated/rust/Cargo.lock has a known vulnerability (RustSec advisory
# database), see docs/changes/012-rust-dependency-audit. Same policy: a hard
# failure that blocks merging, one retry, also in the nightly scheduled
# pipeline. Advisories that a crate is unmaintained or unsound are only shown as
# warnings. Yanked crates are not checked (--no-yanked): that check reads the
# crates.io index through cargo, which this image does not have. To accept an
# advisory that has no fix yet (or a false positive), append `--ignore <ID>`
# (e.g. `--ignore RUSTSEC-2024-0001`) to the cargo-audit command and put a YAML
# comment above it giving the reason and the date; remove it once a fix exists.
# Besides --no-yanked, --file with the lockfile and --ignore, only -D/--deny
# <kind> is allowed: other options, such as --target-os, --url, --db or
# --no-fetch, can hide advisories, and test_ci_config.py fails on them.
# How to fix a finding: CONTRIBUTING.md, section Dependencies > Security audit.
#
# cargo-audit only reads the lockfile, so no Rust toolchain is needed: the job
# downloads the prebuilt cargo-audit for x86_64 Linux (the runners are amd64,
# another name for x86_64) and checks the SHA-256 of the archive before
# unpacking it, on every run. It runs cargo-audit in /tmp with an empty
# CARGO_HOME, so no audit.toml from the checkout can change what is checked. If
# the advisory database can no longer be read (a parse error), raise the
# cargo-audit version. Raise the image, CARGO_AUDIT_VERSION and
# CARGO_AUDIT_SHA256 together, at least once per semester, like pip-audit.
rust_dependency_audit:
  stage: test
  tags:
    - test
  # A small image with curl, pinned by tag and digest (a checksum of the exact
  # image). The image starts curl by default; the empty entrypoint [""] makes
  # GitLab run the script lines below in a shell instead.
  image:
    name: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    entrypoint: [""]
  variables:
    # Keep the version in the local command of CONTRIBUTING.md (Security audit) equal.
    CARGO_AUDIT_VERSION: "0.22.2"
    # SHA-256 of cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz; equals the
    # digest GitHub lists for this release asset.
    CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"
    # An empty directory: cargo-audit reads no audit.toml from it and keeps its
    # advisory database there, fetched fresh on every run.
    CARGO_HOME: /tmp/cargo-home
  # A network hiccup (downloading cargo-audit or the advisory database) fails
  # the script just like a finding; one retry absorbs it. A real finding simply
  # fails twice.
  retry:
    max: 1
    when:
      - script_failure
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Ignored advisories belong in this job, visible in the log, not in a config
    # file that a local `cargo audit` would read. -L also catches a symbolic link
    # whose target does not exist.
    - for f in .cargo/audit.toml generated/rust/.cargo/audit.toml; do if [ -e "$f" ] || [ -L "$f" ]; then echo "$f would change what cargo-audit checks. Add --ignore to the rust_dependency_audit job instead."; exit 1; fi; done
    # The downloaded cargo-audit runs only on x86_64.
    - if [ "$(uname -m)" != "x86_64" ]; then echo "cargo-audit is pinned for x86_64; this runner is $(uname -m)."; exit 1; fi
    # -f fails on an HTTP error, -L follows GitHub's redirect to its download
    # host; --proto and --proto-redir allow HTTPS only, also after the redirect;
    # --tlsv1.2 refuses older TLS versions.
    - curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 -o /tmp/cargo-audit.tgz "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz"
    # Check the archive before anything in it is unpacked or run.
    - echo "$CARGO_AUDIT_SHA256  /tmp/cargo-audit.tgz" | sha256sum -c -
    - tar -xzf /tmp/cargo-audit.tgz -C /tmp
    # Run outside the checkout, so no .cargo/audit.toml in it is read.
    - cd /tmp
    - ./cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit --version
    - ./cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit audit --no-yanked --file "$CI_PROJECT_DIR/generated/rust/Cargo.lock"
  interruptible: true

# Script lines shared by the jobs that compare a merge request with its target
# branch (gitleaks_secret_detection, semgrep_sast); they need GIT_DEPTH: 0.
.merge_base:
  script:
    # Fetch the current target branch explicitly: the runner's checkout may lack
    # it or hold an old copy, and an old merge base would make the scan include
    # commits that are already on the target branch.
    - git fetch origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    # The commit the merge request branched off.
    - BASELINE="$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)"

# Secret detection with Gitleaks in merge requests: scans only the commits of
# the merge request (from the merge base with the target branch to HEAD), so
# old commits never block a merge request, and fails if one of them adds a
# secret (password, API token, private key, ...). It also runs when only
# Markdown changed, as secrets can be in any file. Gitleaks' default rules
# apply; CONTRIBUTING.md explains how to accept a false positive (see also
# docs/changes/007-gitleaks-secret-detection).
gitleaks_secret_detection:
  # In the first stage: the job is quick, and if it finds a secret the test
  # stage does not run at all.
  stage: prepare
  tags:
    - test
  # The official image, pinned by tag and digest (a checksum of the exact
  # image) so that a new release or a moved tag cannot change the result
  # without notice; bump both together. The image starts the gitleaks command by
  # default; the empty entrypoint [""] makes GitLab run the script lines below
  # in a shell instead.
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    # Full history, so that the merge base with the target branch can be found.
    GIT_DEPTH: 0
    # Read git attributes from the empty tree (git's fixed ID for it) instead of
    # the merge request's .gitattributes: an entry such as `* -diff` would hide
    # file contents from `git log -p` and so from the scan. Files that git
    # itself detects as binary are still skipped. Needs git 2.42 or newer; an
    # older git ignores the variable without any warning.
    GIT_ATTR_SOURCE: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
  # The job fetches from GitLab; one retry absorbs a network hiccup. A found
  # secret simply fails twice.
  retry:
    max: 1
    when:
      - script_failure
  script:
    # Avoid git's "dubious ownership" error on a checkout owned by another user.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Log the git version: GIT_ATTR_SOURCE needs git 2.42 or newer (an older
    # git ignores it silently), --remerge-diff below needs 2.36 or newer.
    - git --version
    # Sets BASELINE, the commit the merge request branched off: only commits
    # after it are scanned.
    - !reference [.merge_base, script]
    - echo "Scanning $(git rev-list --count "$BASELINE..HEAD") commit(s) after $BASELINE"
    # A fixed configuration with only the default rules: otherwise gitleaks
    # would read a .gitleaks.toml from the merge request itself, which could
    # switch rules off unnoticed. (.gitleaksignore and gitleaks:allow comments
    # still apply; reviewers check every new entry.)
    - printf '[extend]\nuseDefault = true\n' > /tmp/gitleaks.toml
    # Merges of three or more branches ("octopus" merges) cannot be scanned
    # (--remerge-diff below handles two parents only), so they fail the job.
    - test -z "$(git rev-list --min-parents=3 "$BASELINE..HEAD")" || { echo "Octopus merges cannot be scanned; split them into normal merges."; exit 1; }
    # --remerge-diff also scans what a merge commit changes compared with an
    # automatic merge of its parents, e.g. a secret added while resolving a
    # conflict; gitleaks reads commits with `git log -p`, which by default shows
    # nothing for merge commits. --redact keeps a found secret out of the job
    # log and the report (job logs are readable by every logged-in user); the
    # report keeps the fingerprints needed for .gitleaksignore. gitleaks exits 1
    # on a finding, which fails the job.
    - >
      gitleaks git .
      --log-opts="--remerge-diff $BASELINE..HEAD"
      --config /tmp/gitleaks.toml
      --redact
      --verbose
      --report-format json
      --report-path gitleaks-report.json
  artifacts:
    # Keep the report also when the job fails, so findings can be inspected.
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week
  rules:
    # A scheduled pipeline never matches the merge-request rule below, so this
    # rule changes nothing; it keeps the rules of all jobs alike (see
    # .not_in_scheduled_pipelines), and system/tests/repo/test_ci_config.py requires
    # it:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    # Only in merge requests: the scan needs a target branch.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true

# Static analysis with Semgrep in merge requests: fails only on findings that
# the merge request introduces (compared with the merge base with the target
# branch), so older code never blocks a merge request. Rulesets p/security-audit
# and p/python; Semgrep's default exclusions apply (e.g. tests/ and everything in
# .gitignore). Semgrep does not read notebooks, so the code cells of the
# notebooks the merge request changes are written to Python files first and
# scanned in full. Suppressions are listed in the log, together with the
# findings they hide, and must name a rule. CONTRIBUTING.md explains how to
# accept an intentional finding (see also docs/changes/008-semgrep-sast).
semgrep_sast:
  # In the first stage: the job is quick, and if it finds something the test
  # stage does not run at all. It needs detect-docs-only (same stage) for the
  # DOCS_ONLY variable.
  stage: prepare
  needs:
    - detect-docs-only
  tags:
    - test
  # The official image, pinned by tag and digest (a checksum of the exact
  # image); bump both together. The rulesets themselves are downloaded at scan
  # time and are not pinned, so a new rule can flag new code without a change
  # here.
  image: semgrep/semgrep:1.173.0@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
  variables:
    # Full history, so that the merge base with the target branch can be found.
    GIT_DEPTH: 0
    # Read git attributes from the empty tree instead of the merge request's
    # .gitattributes (as in gitleaks_secret_detection): an entry such as
    # `*.py -diff` would hide the added lines from `git diff` and so from the
    # suppression check below.
    GIT_ATTR_SOURCE: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
    # The options of all scans below. --metrics=off: send no usage data to
    # Semgrep's servers. --max-target-bytes=0: scan files of any size (by
    # default Semgrep skips files over 1 MB without failing).
    SCAN_OPTIONS: --metrics=off --max-target-bytes=0 --config p/security-audit --config p/python
  # The job fetches from GitLab and downloads the rulesets; one retry absorbs a
  # network hiccup. A real finding simply fails twice.
  retry:
    max: 1
    when:
      - script_failure
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Avoid git's "dubious ownership" error on a checkout owned by another user.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Log the git version: GIT_ATTR_SOURCE needs git 2.42 or newer (an older
    # git ignores it silently).
    - git --version
    # Sets BASELINE, the commit the merge request branched off: only findings
    # that are new since then fail the job.
    - !reference [.merge_base, script]
    - echo "Reporting findings introduced since $BASELINE"
    # The image expects the code mounted at /src unless this variable is unset;
    # GitLab checks the code out into the working directory instead.
    - unset SEMGREP_IN_DOCKER
    # Files must not drop out of the scan without a trace in the code: adding
    # or changing a .semgrepignore fails the job, and so does a file of the
    # merge request that matches a .gitignore (Semgrep may skip such files
    # although git tracks them). git check-ignore exits with 0 if a file
    # matches, 1 if none does, and 128 on an error.
    - |
      if git diff --name-only "$BASELINE" HEAD | grep -E '(^|/)\.semgrepignore$'; then
        echo "A .semgrepignore would remove files from the scan; change this job instead."
        exit 1
      fi
      status=0
      git diff -z --name-only --diff-filter=d "$BASELINE" HEAD | git check-ignore -z --no-index --stdin > /tmp/ignored || status=$?
      if [ "$status" -eq 0 ]; then
        tr '\0' '\n' < /tmp/ignored
        echo "These files match a .gitignore, so Semgrep may not scan them; change the .gitignore."
        exit 1
      elif [ "$status" -ne 1 ]; then
        echo "git check-ignore failed."
        exit 1
      fi
    # Suppressions must stay visible to reviewers. In the Python files the
    # merge request changes (tests are not scanned anyway), every added line
    # that mentions a Semgrep suppression is listed in the log, and each must be
    # a comment of its own that names a rule; a bare or differently written
    # suppression, or one at the end of a line of code, fails the job. (A
    # correctly written one on a line of its own inside a multi-line string
    # passes, but is listed as well.) awk reads only the
    # lines inside the diff's hunks (after "@@"), so that the "+++ b/<path>"
    # header lines never count. Suppressions in notebooks are checked further
    # below, on the converted code.
    - git diff -U0 "$BASELINE" HEAD -- '*.py' '*.pyi' ':(exclude)*/tests/*' | awk '/^diff --git /{hunk=0} /^@@/{hunk=1; next} hunk && /^\+/ && tolower($0) ~ /nosem/' > /tmp/suppressions
    - |
      if [ -s /tmp/suppressions ]; then
        echo "Suppressions added by this merge request (reviewers check each):"
        cat /tmp/suppressions
        if grep -vE '^\+[[:space:]]*# nosemgrep: [A-Za-z0-9_.-]+$' /tmp/suppressions; then
          echo "A suppression must be a comment line of its own that names a rule: # nosemgrep: <rule-id>"
          exit 1
        fi
        # The new findings, including those the suppressions hide, for the
        # reviewers; this scan does not fail the job.
        echo "All findings, including those hidden by suppressions (for review only):"
        semgrep scan $SCAN_OPTIONS --baseline-commit "$BASELINE" --disable-nosem || true
      fi
    # --error fails the job on a new finding. The findings are printed to the
    # log; a copy in GitLab's SAST format is kept as an artifact (for the Python
    # files only; findings in notebooks appear only in the log).
    - >
      semgrep scan
      $SCAN_OPTIONS
      --baseline-commit "$BASELINE"
      --error
      --gitlab-sast-output=gl-sast-report.json
    # Semgrep cannot read notebooks, and its comparison with the merge base only
    # covers files in git. So the code cells of the notebooks that the merge
    # request changes (deleted ones left out) are written to Python files by
    # .ci/notebook_code.py, and these files are scanned in full. Unchanged
    # notebooks are not scanned, so that a new rule cannot block an unrelated
    # merge request. The file names are separated by NUL bytes (-z), so that
    # any name works. The script fails if a notebook's code is not valid Python
    # after the conversion, as Semgrep would skip such code with only a warning.
    # In the converted code, every line that mentions a suppression is listed
    # for the reviewers, with the findings it hides, and must be a comment of
    # its own that names a rule (as in the Python files above).
    - git diff -z --name-only --diff-filter=d "$BASELINE" HEAD -- '*.ipynb' > /tmp/changed_notebooks
    - |
      if [ -s /tmp/changed_notebooks ]; then
        # Whether code is valid Python depends on the Python version (e.g. f-strings
        # in 3.12), which should match the project's.
        python3 --version
        xargs -0 python3 .ci/notebook_code.py /tmp/notebook_code < /tmp/changed_notebooks
        grep -rinE 'nosem' /tmp/notebook_code > /tmp/notebook_suppressions || true
        if [ -s /tmp/notebook_suppressions ]; then
          echo "Suppressions in the changed notebooks (reviewers check the new ones):"
          cat /tmp/notebook_suppressions
          if grep -vE '^[^:]+:[0-9]+:[[:space:]]*# nosemgrep: [A-Za-z0-9_.-]+$' /tmp/notebook_suppressions; then
            echo "A suppression must be a comment line of its own that names a rule: # nosemgrep: <rule-id>"
            exit 1
          fi
          echo "All findings, including those hidden by suppressions (for review only):"
          semgrep scan $SCAN_OPTIONS --disable-nosem /tmp/notebook_code || true
        fi
        semgrep scan $SCAN_OPTIONS --error /tmp/notebook_code
      else
        echo "No notebook changed."
      fi
  artifacts:
    # Keep the report also when the job fails.
    when: always
    reports:
      sast: gl-sast-report.json
    expire_in: 1 week
  rules:
    # A scheduled pipeline never matches the merge-request rule below, so this
    # rule changes nothing; it keeps the rules of all jobs alike (see
    # .not_in_scheduled_pipelines), and system/tests/repo/test_ci_config.py requires
    # it:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    # Only in merge requests: the scan needs a target branch.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true

py_test:
  stage: test
  extends: .not_in_scheduled_pipelines
  tags:
    - test
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Install the locked environment
    - uv sync --frozen
    # Show the resolved dependency versions
    - uv pip freeze
    # Run all unit tests with coverage
    - uv run coverage run -m unittest discover system/tests/
    # Print the summary so GitLab can read the total (see `coverage:` below).
    - uv run coverage report
    - uv run coverage html
  # GitLab reads the coverage value from the TOTAL line of `coverage report`
  # (shown in merge requests and in the project's coverage badge). Keep the
  # capture group: GitLab uses it as the value; without it, GitLab would take
  # the first number on the line (the statement count). Changing the report
  # layout (e.g. branch coverage or show_missing in .coveragerc, or a coverage
  # upgrade) can change the TOTAL line; the regex then silently stops matching
  # and GitLab records no value (no error), so adapt it together with such a
  # change.
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%$/'
  interruptible: true
  artifacts:
    paths:
      - htmlcov/*


# Checks and tests the Rust port of the store core in generated/rust/ (see
# docs/changes/011-rust-store-foundation): formatting, lints, doc comments
# (missing ones and broken links fail the job) and unit tests. The official
# Rust image, pinned by tag and digest (a checksum of the exact image); its
# version must be the same as the channel in generated/rust/rust-toolchain.toml
# and rust-version in generated/rust/Cargo.toml, so change all three together.
# No cache and no coverage value: a coverage value here would be mixed into the
# Python value GitLab shows for the pipeline. No `needs`: without it the job gets the
# dotenv reports of all earlier-stage jobs, including DOCS_ONLY from
# detect-docs-only; a `needs` list would have to name detect-docs-only.
rust_test:
  stage: test
  extends: .not_in_scheduled_pipelines
  tags:
    - test
  image: rust:1.98.1-slim-bookworm@sha256:ff521445a372125ed4f76e1453a1f8098f2d05332d1601d30db1c1f62757e730
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    - cd generated/rust
    # The image has the minimal profile without rustfmt and clippy. rustup
    # downloads them from static.rust-lang.org and checks them against the
    # hashes of the signed channel manifest.
    - rustup component add rustfmt clippy
    # Show the versions: a mismatch with rust-toolchain.toml would make rustup
    # download a second toolchain.
    - rustc --version
    - cargo --version
    - cargo fmt --check
    # --locked: use exactly the versions in Cargo.lock, fail if it is out of date.
    - cargo clippy --all-targets --locked -- -D warnings
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
    - cargo test --locked
  interruptible: true

# Checks that the Rust code in generated/rust/ is up to date with the Python
# code it is generated from and was not edited by hand (see
# generated/rust/README.md and .ci/check_generated.py). It fails on main and in
# the nightly pipeline; in a merge request it only warns (allow_failure), so a
# Python change can be merged before its Rust image is regenerated. The script
# needs only Python's standard library, so no uv sync.
generated_rust_check:
  stage: test
  tags:
    - test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      allow_failure: true
    - when: on_success
  script:
    - python3 .ci/check_generated.py
  interruptible: true

# Runs the larger schedule spaces of the serializability test of the MVCC store
# (system/tests/stores/test_mvcc_serializability.py, NightlySerializabilityTest: three
# transactions, voluntary aborts, longer transactions) and the two-transaction
# validation tests under further hash seeds. This takes about two hours and is
# too slow for every merge request. It runs in the nightly scheduled pipeline on
# main; in a merge request it can be started by hand and does not block the
# merge. No coverage: it would make the run several times slower, and the code
# it runs is already covered by py_test. The job fails if all tests were
# skipped, e.g. because EXPLAINDB_NIGHTLY did not reach them.
serializability_nightly:
  stage: test
  tags:
    - test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
      allow_failure: true
  variables:
    EXPLAINDB_NIGHTLY: "1"
  timeout: 4h
  script:
    - uv sync --frozen
    # Show the output while the tests run (tee) and keep their exit status: the
    # braced group ends with `echo`, so its own exit status is always 0, and the
    # status of the tests is written to a file instead; `|| status=$?` keeps a
    # failing test run from ending the job before the status is written.
    - |
      { status=0; uv run python -m unittest -v system.tests.stores.test_mvcc_serializability.NightlySerializabilityTest || status=$?; echo "$status" > nightly.status; } 2>&1 | tee nightly.log
      if [ "$(cat nightly.status)" != "0" ]; then exit 1; fi
      # unittest ends with "Ran N tests in ..." and, if tests were skipped,
      # "(skipped=M)"; fail if every test was skipped:
      ran=$(sed -n 's/^Ran \([0-9]*\) tests\{0,1\} in .*/\1/p' nightly.log | tail -n 1)
      skipped=$(sed -n 's/.*skipped=\([0-9]*\).*/\1/p' nightly.log | tail -n 1)
      if [ -z "$ran" ] || [ "$ran" -eq "${skipped:-0}" ]; then echo "All nightly tests were skipped; is EXPLAINDB_NIGHTLY set?"; exit 1; fi
    # The two-transaction validation tests under further hash seeds: the store
    # iterates over sets of object ids, whose order Python picks at random per
    # process (hash seed); a bug may show only under some orders.
    - |
      for seed in 1 2 3; do
        PYTHONHASHSEED=$seed uv run python -m unittest \
          system.tests.stores.test_mvcc_serializability.SerializabilityTest.test_validation_method_1_brute_force \
          system.tests.stores.test_mvcc_serializability.SerializabilityTest.test_validation_method_2_write_sets || exit 1
      done
  interruptible: true

ipynb_test:
  stage: test
  extends: .not_in_scheduled_pipelines
  tags:
    - test
  # Run the notebooks in parallel across several jobs to cut wall-clock time.
  # Every notebook is still executed -- .ci/assign_notebooks.py splits the set
  # across the N instances, so coverage is unchanged, only faster.
  parallel: 3
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # Install the locked environment
    - uv sync --frozen
    # Execute this instance's slice of the notebooks. GitLab sets CI_NODE_INDEX
    # (1..N) and CI_NODE_TOTAL (N); .ci/assign_notebooks.py reads those and packs
    # the notebooks onto the instances by measured run time (LPT bin-packing, see
    # .ci/notebook_weights.tsv) so the instances finish at roughly the same time.
    # We run from the notebooks/ directory so the working directory matches an
    # interactive Jupyter session (kernel cwd = the notebook's folder): notebooks
    # reach the `system` package via their sys.path bootstrap cell and read their
    # data files relative to notebooks/. `set -e` makes the job fail as soon as
    # any notebook raises.
    - |
      set -e
      cd notebooks
      python3 "$CI_PROJECT_DIR/.ci/assign_notebooks.py" > /tmp/nb_slice
      while IFS= read -r nb; do
        echo "== [node ${CI_NODE_INDEX:-1}/${CI_NODE_TOTAL:-1}] running $nb =="
        uv run jupyter nbconvert --to script "$nb" --stdout > /tmp/nb.py
        uv run ipython /tmp/nb.py
      done < /tmp/nb_slice
  interruptible: true


stats_and_linting:
  stage: test
  extends: .not_in_scheduled_pipelines
  tags:
    - test
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only).
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    # count lines of code for each py and ipynb file, plus the sum:
    - find . \( -iname \*.ipynb -o -iname \*.py \) -not -path "*venv*" -print0 | xargs -0 wc -l > LOC.txt
    # Install the locked environment, required for pylint and nbqa
    - uv sync --frozen
    # show pylint output of code for each py file:
    - find . -iname \*.py -not -path "*venv*" -print0 | xargs -0 uv run pylint --exit-zero > pylint_py.txt
    # show pylint output of code for each ipynb file:
    - find . -iname \*.ipynb -not -path "*venv*" -print0 | xargs -0 uv run nbqa pylint --exit-zero > pylint_ipynb.txt
  artifacts:
    paths:
      - LOC.txt
      - pylint_py.txt
      - pylint_ipynb.txt
  interruptible: true


# Build the API documentation on merge requests as a pre-merge check only (no
# preview is published). A broken import, dangling cross-reference, or
# unconverted Javadoc tag fails the pipeline here, before the change reaches the
# default branch where `pages` would publish it. Scoped to merge-request
# pipelines: on the default branch the `pages` job already runs the same build.
docs_build:
  stage: test
  tags:
    - test
  rules:
    # A scheduled pipeline never matches the merge-request rule below, so this
    # rule changes nothing; it keeps the rules of all jobs alike (see
    # .not_in_scheduled_pipelines), and system/tests/repo/test_ci_config.py requires
    # it:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    # Skip when the merge request only changes Markdown (see detect-docs-only);
    # the API site is generated from the .py sources, so Markdown-only changes
    # cannot affect it.
    - if [ "$DOCS_ONLY" = "true" ]; then echo "Only Markdown changed; skipping."; exit 0; fi
    - !reference [.build_docs, script]
  interruptible: true


# Publish the API documentation to GitLab Pages from the default branch only.
# Pages serves the `public/` artifact; access is restricted to project members
# (pages_access_level=private on this project).
pages:
  stage: deploy
  tags:
    - test
  rules:
    # Not in the nightly scheduled pipeline on main, which would otherwise
    # publish the pages again (see .not_in_scheduled_pipelines):
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  script:
    - !reference [.build_docs, script]
  artifacts:
    paths:
      - public
